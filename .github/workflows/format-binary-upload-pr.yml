# Temporary formatter for the same-repository binary upload PR.
# Removed after the one-time normalization commit.
name: Normalize binary upload PR
on:
  pull_request:
    paths: ['.github/workflows/format-binary-upload-pr.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/binary-4k-firmware-upload' && github.event.pull_request.head.repo.full_name == 'marre/slpanel'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/composables/use-device.ts src/lib/device-serial.ts src/lib/device-serial.test.ts src/lib/firmware-protocol.ts src/lib/firmware-updater.ts src/lib/firmware-updater.test.ts src/test/device-port.ts
      - name: Commit normalized formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/composables/use-device.ts src/lib/device-serial.ts src/lib/device-serial.test.ts src/lib/firmware-protocol.ts src/lib/firmware-updater.ts src/lib/firmware-updater.test.ts src/test/device-port.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(web): normalize binary upload files"
            git push origin HEAD:refs/heads/feat/binary-4k-firmware-upload
          fi
