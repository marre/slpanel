name: Temporary presentation branch formatting
on:
  push:
    branches:
      - docs/presentation-architecture-plan
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/presentation-architecture-plan
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:fix
      - run: npm run lint:fix
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply Prettier and ESLint formatting"
            git push origin HEAD:docs/presentation-architecture-plan
          fi
