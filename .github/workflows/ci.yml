name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect formatting for compact filters
        run: |
          npx prettier --write src/components/filter-picker.test.ts src/routes/devices-page.vue src/routes/scenes-page.vue src/routes/schedules-page.vue
          git diff -- src/components/filter-picker.test.ts src/routes/devices-page.vue src/routes/scenes-page.vue src/routes/schedules-page.vue

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Verify D1 migration against existing data
        run: python3 scripts/test_d1_migration.py

      - name: Check formatting
        run: npm run format

      - name: Build application
        run: npm run build

  # Deployments are handled by the Cloudflare GitHub Integration.
