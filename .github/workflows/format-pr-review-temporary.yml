name: Temporary PR review test formatting
on:
  push:
    branches:
      - docs/presentation-architecture-plan
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/presentation-architecture-plan
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/api/scene-service.test.ts src/api/scenes-api.test.ts
      - name: Commit formatting output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/api/scene-service.test.ts src/api/scenes-api.test.ts
            git commit -m "style: format review regression tests"
            git push origin HEAD:docs/presentation-architecture-plan
          fi
